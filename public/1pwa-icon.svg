<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="roof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container with rounded corners (iOS & Android friendly) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Outer accent ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.25"/>

  <!-- House roof icon element -->
  <path d="M 256 110 L 390 220 L 350 220 L 256 142 L 162 220 L 122 220 Z" fill="url(#roof-grad)" filter="url(#glow)"/>

  <!-- V-Shape Logo (viziGO emblem) -->
  <path d="M 160 210 L 256 390 L 352 210 L 300 210 L 256 300 L 212 210 Z" fill="url(#v-grad)" filter="url(#glow)"/>

  <!-- Accent dot / Community pin symbol -->
  <circle cx="256" cy="180" r="22" fill="#F59E0B" filter="url(#glow)"/>
</svg>
