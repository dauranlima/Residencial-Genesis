    <!-- Suporte para iOS Splash Screen (apple-touch-startup-image) -->
    <link rel="apple-touch-startup-image" href="/pwa-512x512.png" />
    <script>
      (function() {
        if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
          try {
            var width = window.screen.width * (window.devicePixelRatio || 1);
            var height = window.screen.height * (window.devicePixelRatio || 1);
            var canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            var ctx = canvas.getContext('2d');
            if (ctx) {
              ctx.fillStyle = '#0f172a';
              ctx.fillRect(0, 0, width, height);
              var img = new Image();
              img.onload = function() {
                var iconSize = Math.min(width, height) * 0.22;
                var x = (width - iconSize) / 2;
                var y = (height - iconSize) / 2 - (height * 0.04);
                ctx.drawImage(img, x, y, iconSize, iconSize);
                var link = document.createElement('link');
                link.rel = 'apple-touch-startup-image';
                link.href = canvas.toDataURL('image/png');
                document.head.appendChild(link);
              };
              img.src = '/pwa-512x512.png';
            }
          } catch(e) {}
        }
      })();
    </script>

  <body>
    <div id="root">
      <!-- Splash Screen HTML/CSS Instantânea (Exibida antes do React montar) -->
      <style>
        .vizigo-splash-container {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          width: 100vw;
          height: 100vh;
          background-color: #0f172a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          color: #f8fafc;
          overflow: hidden;
          user-select: none;
          -webkit-user-select: none;
        }
        .vizigo-splash-logo-wrapper {
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
        }
        .vizigo-splash-glow {
          position: absolute;
          width: 130px;
          height: 130px;
          background: radial-gradient(circle, rgba(59, 130, 246, 0.4) 0%, rgba(99, 102, 241, 0.15) 50%, rgba(15, 23, 42, 0) 75%);
          border-radius: 50%;
          animation: vizigo-pulse 2s infinite ease-in-out;
        }
        .vizigo-splash-logo {
          position: relative;
          width: 88px;
          height: 88px;
          border-radius: 22px;
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.35);
          object-fit: cover;
          animation: vizigo-scale 0.7s ease-out;
        }
        .vizigo-splash-title {
          font-size: 28px;
          font-weight: 800;
          letter-spacing: -0.5px;
          background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin: 0 0 6px 0;
        }
        .vizigo-splash-subtitle {
          font-size: 14px;
          font-weight: 500;
          color: #94a3b8;
          margin: 0 0 32px 0;
          text-align: center;
          padding: 0 16px;
        }
        .vizigo-splash-loader-bar {
          width: 140px;
          height: 4px;
          background-color: rgba(255, 255, 255, 0.1);
          border-radius: 999px;
          overflow: hidden;
          position: relative;
        }
        .vizigo-splash-loader-progress {
          position: absolute;
          left: -100%;
          top: 0;
          bottom: 0;
          width: 100%;
          background: linear-gradient(90deg, #3b82f6 0%, #6366f1 100%);
          border-radius: 999px;
          animation: vizigo-loading 1.4s infinite ease-in-out;
        }
        @keyframes vizigo-pulse {
          0%, 100% { transform: scale(1); opacity: 0.6; }
          50% { transform: scale(1.25); opacity: 0.95; }
        }
        @keyframes vizigo-scale {
          0% { transform: scale(0.85); opacity: 0; }
          100% { transform: scale(1); opacity: 1; }
        }
        @keyframes vizigo-loading {
          0% { left: -100%; }
          50% { left: 0%; }
          100% { left: 100%; }
        }
      </style>

      <div class="vizigo-splash-container">
        <div class="vizigo-splash-logo-wrapper">
          <div class="vizigo-splash-glow"></div>
          <img src="/pwa-512x512.png" alt="viziGO" class="vizigo-splash-logo" />
        </div>
        <h1 class="vizigo-splash-title">viziGO</h1>
        <p class="vizigo-splash-subtitle">Classificados do seu condomínio</p>
        <div class="vizigo-splash-loader-bar">
          <div class="vizigo-splash-loader-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
